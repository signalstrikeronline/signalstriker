<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="⚡📡 SignalStrike.online 🤖 AI-Driven Crypto Signals & Trend | Read More 👇 📊 Real-Time Insights. Smart Entries. Precision Strikes. 🎯 🚀 Stay Ahead. Strike First.">
    <meta name="twitter:description" content="🔥 Aggressive / Alpha Style ⚡ AI hunts the trend. You strike the profit. 📡 Real-time crypto signals 📈 Early entries. Smart exits. 💥 No noise. Just alpha.">
    <meta name="twitter:image" content="https://signalstrike.online/acc1/8.png">
    <title>SignalStrike · redirecting</title>
    <style>
        /* reset & full bleed */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0b0f15; /* fallback */
            min-height: 100vh;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            position: relative;
        }

        /* VIDEO BACKGROUND — fills entire page */
        #bgVideo {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            z-index: -2;
            pointer-events: none;
        }

        /* subtle dark overlay — keeps text readable, no modal effect */
        .video-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(2, 6, 15, 0.65);
            z-index: -1;
            pointer-events: none;
        }

        /* ---------- simple redirect message (non‑modal, just text) ---------- */
        .redirect-message {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 2.2rem;
            font-weight: 300;
            text-align: center;
            z-index: 10;
            background: rgba(10, 20, 30, 0.4);
            backdrop-filter: blur(8px);
            padding: 1.8rem 3.2rem;
            border-radius: 60px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
            letter-spacing: 0.5px;
            line-height: 1.4;
            text-shadow: 0 2px 10px #00000080;
            pointer-events: none;      /* so it doesn't block anything, purely visual */
        }

        .redirect-message small {
            display: block;
            font-size: 1rem;
            margin-top: 0.7rem;
            color: #b0c7e0;
            font-weight: 200;
            letter-spacing: 1px;
        }

        /* optional loader spinner (very light) */
        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s ease-in-out infinite;
            margin-left: 8px;
            vertical-align: middle;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* no trace of modal styles — everything clean */
    </style>
</head>
<body>
    <!-- VIDEO BACKGROUND: signal.mp4, static, loops, muted -->
    <video id="bgVideo" autoplay muted loop playsinline>
        <source src="signal.mp4" type="video/mp4">
        <!-- fallback if video not supported — background stays dark -->
    </video>

    <!-- dark overlay (same as before, keeps contrast) -->
    <div class="video-overlay"></div>

    <!-- SIMPLE REDIRECT MESSAGE – not a modal, just centered text, no interaction -->
    <div class="redirect-message">
        ⚡ redirecting to SignalStrike<br>
        <small>you will be forwarded in 5 seconds <span class="spinner"></span></small>
    </div>

    <!-- REDIRECT SCRIPT: 5 seconds then go to access.html -->
    <script>
        (function() {
            // Redirect after exactly 5 seconds to the target URL
            setTimeout(function() {
                window.location.href = 'https://signalstrike.online/access.html';
            }, 5000);  // 5000ms = 5 seconds

            // (Optional) if you want to show a countdown, but not needed.
            // No modal, no country selection, just clean redirect.
        })();
    </script>

    <!-- NO MODAL WHATSOEVER – all country‑list, close button, overlay popup removed -->
</body>
</html>
