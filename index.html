<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>sleep • video signal</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0b0f15;
            min-height: 100vh;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            position: relative;
        }

        /* VIDEO BACKGROUND */
        #bgVideo {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            z-index: -2;
            pointer-events: none;
        }

        /* Dark overlay to make text (if any) readable – kept for ambiance */
        .video-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(2, 6, 15, 0.65);
            z-index: -1;
            pointer-events: none;
        }

        /* Optional: you could add a small "redirecting" message if desired */
        .message {
            position: fixed;
            bottom: 20px;
            right: 20px;
            color: #aaa;
            font-size: 0.9rem;
            background: rgba(0,0,0,0.3);
            padding: 6px 12px;
            border-radius: 40px;
            backdrop-filter: blur(4px);
            z-index: 10;
        }
    </style>
</head>
<body>
    <!-- VIDEO BACKGROUND -->
    <video id="bgVideo" autoplay muted loop playsinline>
        <source src="signal.mp4" type="video/mp4">
    </video>
    <div class="video-overlay"></div>

    <!-- Optional small message (can be removed) -->
    <div class="message">preparing experience...</div>

    <script>
        // Redirect to connect.html after 5 seconds
        setTimeout(function() {
            window.location.href = 'connect.html';
        }, 5000); // 5000 ms = 5 seconds
    </script>
</body>
</html>
