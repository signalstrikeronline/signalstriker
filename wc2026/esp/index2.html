<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SignalStrike</title>

    <!-- ===== X (Twitter) Cards ===== -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="🔴 LIVE | ¡Predice ahora!" />
    <meta name="twitter:description" content="¡Todos ganan! Cada predicción vale dinero. ¡Haz tu predicción ahora!" />
    <meta name="twitter:image" content="https://signalstrike.online/wc2026/esp/2.png" />
    <meta name="twitter:url" content="https://signalstrike.online" />



    <!-- ===== Fallback redirect (if JS is disabled) ===== -->
    <meta http-equiv="refresh" content="0; url=https://partner.bybit.com/b/wc2026es" />

    <style>
        /* ── minimal styling for the brief moment before redirect ── */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: #0b0e14;
            color: #eaeef2;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            padding: 1.5rem;
            text-align: center;
        }

        .container {
            max-width: 560px;
            padding: 2.5rem 2rem;
            background: #141a24;
            border-radius: 2rem;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(2px);
        }

        .badge {
            display: inline-block;
            background: #f7931a;
            color: #0b0e14;
            font-weight: 700;
            font-size: 0.75rem;
            letter-spacing: 0.06em;
            padding: 0.3rem 1rem;
            border-radius: 100px;
            text-transform: uppercase;
            margin-bottom: 1.25rem;
        }

        h1 {
            font-size: 1.8rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            margin-bottom: 0.75rem;
            background: linear-gradient(135deg, #f7931a, #ffb347);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        p {
            font-size: 1rem;
            line-height: 1.6;
            color: #b0bac9;
            margin-bottom: 1.5rem;
        }

        .spinner {
            display: inline-block;
            width: 40px;
            height: 40px;
            border: 4px solid rgba(255, 255, 255, 0.06);
            border-top-color: #f7931a;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0.5rem 0 0.25rem;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .redirect-note {
            font-size: 0.8rem;
            color: #6a7a8e;
            margin-top: 1.25rem;
            border-top: 1px solid rgba(255, 255, 255, 0.04);
            padding-top: 1.25rem;
        }

        .redirect-note a {
            color: #f7931a;
            text-decoration: none;
            font-weight: 500;
        }

        .redirect-note a:hover {
            text-decoration: underline;
        }

        /* ── small screen tweaks ── */
        @media (max-width: 480px) {
            .container {
                padding: 1.75rem 1.25rem;
            }
            h1 {
                font-size: 1.4rem;
            }
        }
    </style>
</head>
<body>

    

    <!-- ===== JavaScript redirect ===== -->
    <script>
        // Immediate redirect to Bybit
        window.location.replace('https://partner.bybit.com/b/wc2026es');
    </script>

</body>
</html>
