/* ==========================================================
   SIGNALSTRIKE — MOBILE / RESPONSIVE OVERRIDES
   Paste this block at the VERY END of your <style> tag
   (after the "Touch devices" media query).
   ========================================================== */

/* ---------- Global fixes ---------- */
html { -webkit-text-size-adjust: 100%; }
body { overflow-wrap: anywhere; }
img, svg { max-width: 100%; }

/* Anchors/sidebar jumps no longer hide under the sticky nav + ticker */
.dash-section, .welcome-banner { scroll-margin-top: 110px; }

/* Use dynamic viewport units so iOS/Android URL bars don't cut content off */
#loadingScreen { height: 100dvh; }
.dash-wrap { min-height: calc(100dvh - 94px); }
.sidebar { height: calc(100dvh - 94px); }

/* Notch / status-bar safe area for the sticky header */
.topnav {
  padding-top: calc(8px + env(safe-area-inset-top, 0px));
  padding-left: max(1.25rem, env(safe-area-inset-left, 0px));
  padding-right: max(1.25rem, env(safe-area-inset-right, 0px));
}
.ticker-wrap { position: sticky; top: calc(60px + env(safe-area-inset-top, 0px)); z-index: 90; }

/* Lighter blur while locked (heavy filters lag on phones) */
body.is-locked .dash-wrap,
body.is-locked .ticker-wrap { filter: blur(4px); }

/* Modals: stop background scroll-through, allow smooth inner scrolling */
.full-modal, .gate-card, .bybit-modal-box { overscroll-behavior: contain; -webkit-overflow-scrolling: touch; }

/* ---------- Touch usability (all touch devices) ---------- */
@media (pointer: coarse) {
  .btn-logout, .nav-tab, .bybit-check-btn, .bybit-verify-btn,
  .btn-read, .btn-archive, .reward-claim-btn,
  .gate-btn-primary, .gate-btn-secondary,
  .bybit-modal-yes, .bybit-modal-no, .verify-submit, .modal-tab {
    min-height: 44px;
  }
  .full-modal-close, .bybit-modal-close { min-width: 44px; min-height: 44px; font-size: 1rem; }
  .sidebar-link { min-height: 44px; }
  .dash-section-link { padding: 8px 0; display: inline-block; }
  a, button { touch-action: manipulation; }

  /* No floating card animation on touch (saves battery, avoids jitter) */
  .reward-card { animation: none; }
}

/* Inputs must be >=16px or iOS Safari zooms the page on focus */
.verify-input, .gate-verify-input { font-size: 16px; min-height: 48px; }

/* ---------- Tablet portrait (<= 900px) ---------- */
@media (max-width: 900px) {
  .topnav { min-height: calc(58px + env(safe-area-inset-top, 0px)); }
  .ticker-wrap { top: calc(58px + env(safe-area-inset-top, 0px)); }

  /* Bottom nav: scrolls sideways so all 7 sections fit */
  .mobile-nav {
    justify-content: flex-start;
    overflow-x: auto;
    overscroll-behavior-x: contain;
    scrollbar-width: none;
    -webkit-overflow-scrolling: touch;
    padding-left: max(6px, env(safe-area-inset-left, 0px));
    padding-right: max(6px, env(safe-area-inset-right, 0px));
  }
  .mobile-nav::-webkit-scrollbar { display: none; }
  .mnav-item { flex: 0 0 auto; min-width: 66px; min-height: 52px; padding: 6px 8px; font-size: 0.55rem; }
  .mnav-item .mnav-icon { font-size: 1.15rem; }

  .content { padding-bottom: calc(6.5rem + env(safe-area-inset-bottom, 0px)); }
  .whale-amount { white-space: nowrap; }
}

/* ---------- Phone (<= 640px) ---------- */
@media (max-width: 640px) {
  .topnav {
    min-height: calc(54px + env(safe-area-inset-top, 0px));
    padding-left: max(0.85rem, env(safe-area-inset-left, 0px));
    padding-right: max(0.85rem, env(safe-area-inset-right, 0px));
  }
  .ticker-wrap { top: calc(54px + env(safe-area-inset-top, 0px)); }
  .ticker-item { font-size: 0.62rem; }
  .ticker-status-text { display: none; }          /* keep just the status dot */
  .ticker-status { padding: 0 8px; }
  .ticker-wrap::after { right: 24px; }

  /* Calmer hard shadows on small screens */
  :root { --shadow: 3px 3px 0 #111; --shadow-lg: 4px 4px 0 #111; }

  /* Welcome banner */
  .wb-stats { display: grid; grid-template-columns: 1fr 1fr; }
  .wb-sub { font-size: 0.82rem; }

  /* Rewards header stacks cleanly */
  #rewards .dash-section-head { flex-direction: column; align-items: stretch; }
  #rewards .dash-section-head > div:last-child { justify-content: space-between; flex-wrap: wrap; }
  .bybit-banner { flex-direction: column; align-items: flex-start; }

  /* Issue card: header text + stacked sections */
  .icb-line { font-size: 0.82rem; }
  .issue-card-header { cursor: pointer; }

  /* Signal cells: tighter, more readable */
  .sc-pct { font-size: 1.6rem; }
  .sc-meta { font-size: 0.74rem; }

  /* Whale rows: icon + amount on first line, text below */
  .whale-row { align-items: center; }
  .whale-icon { order: 1; }
  .whale-addr { word-break: break-all; }

  /* Meme table: drop the "Name" column instead of forcing sideways scroll */
  .meme-table { min-width: 0; table-layout: auto; }
  .meme-table th:nth-child(3),
  .meme-table td:nth-child(3) { display: none; }
  .meme-table th, .meme-table td { padding: 0.65rem 0.55rem; }
  .meme-table th:nth-child(1), .meme-table td:nth-child(1) { width: 28px; padding-right: 0; }

  /* Metrics: 2x2 with smaller numbers */
  .mc-val { font-size: 1.7rem; }

  /* DeFi */
  .dc-desc { font-size: 0.8rem; }

  /* Full-screen modals respect safe areas */
  .full-modal {
    height: 100dvh; max-height: 100dvh;
    padding-top: calc(1rem + env(safe-area-inset-top, 0px));
    padding-bottom: calc(3rem + env(safe-area-inset-bottom, 0px));
  }
  .full-modal-close { top: calc(0.6rem + env(safe-area-inset-top, 0px)); }
  .tracker-modal-grid .whale-row { padding: 0.8rem; }

  /* Bybit + gate modals become bottom sheets */
  .bybit-modal-backdrop, .gate-backdrop { align-items: flex-end; padding: 0; }
  .bybit-modal-box, .gate-card {
    max-width: 100%;
    border-radius: 14px 14px 0 0;
    border-bottom: none;
    max-height: 92dvh;
    padding-bottom: calc(1.5rem + env(safe-area-inset-bottom, 0px));
  }
  .gate-card { padding-top: 2rem; }
  .gate-logo { font-size: 1.2rem; margin-bottom: 0.75rem; }
  .gate-sub { margin-bottom: 1.1rem; }

  /* Toast sits above the bottom nav */
  #toast { bottom: calc(5.75rem + env(safe-area-inset-bottom, 0px)); }
}

/* ---------- Small phones (<= 400px) ---------- */
@media (max-width: 400px) {
  .nav-logo { font-size: 0.95rem; }
  .wb-stats { grid-template-columns: 1fr; }
  .wb-stat .num { font-size: 1.5rem; }
  .mnav-item { min-width: 60px; }
  .gate-access-option-price { font-size: 1.4rem; }
  .meme-table th:nth-child(6), .meme-table td:nth-child(6) { display: none; } /* hide Market Cap */
}

/* ---------- Landscape phones (short viewports) ---------- */
@media (max-height: 480px) and (orientation: landscape) {
  .mobile-nav { padding-top: 3px; padding-bottom: calc(3px + env(safe-area-inset-bottom, 0px)); }
  .mnav-item { flex-direction: row; gap: 6px; min-height: 40px; }
  .gate-backdrop, .bybit-modal-backdrop { align-items: center; }
  .gate-card, .bybit-modal-box { border-radius: var(--radius); border-bottom: var(--border); max-height: 96dvh; }
}

/* ---------- Respect reduced-motion ---------- */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; scroll-behavior: auto !important; }
  .ticker-inner { animation: none !important; overflow-x: auto; }
  .delay-1, .delay-2, .delay-3, .delay-4 { opacity: 1; }
}
