<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Dashboard — SignalStrike Members</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,400;0,500;0,700;0,900;1,400;1,700&family=Space+Mono:ital,wght@0,400;0,700;1,400&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #FFFEF2;
    --bg2: #FFF9E6;
    --pink: #FF90E8;
    --pink-dark: #d966c8;
    --lime: #A8FF78;
    --lime-dark: #5dcf2a;
    --yellow: #FFE194;
    --yellow-dark: #e8c300;
    --black: #111111;
    --white: #FFFFFF;
    --border: 2px solid #111111;
    --shadow: 4px 4px 0px #111111;
    --shadow-sm: 3px 3px 0px #111111;
    --shadow-lg: 6px 6px 0px #111111;
    --radius: 6px;
    --font-body: 'DM Sans', sans-serif;
    --font-mono: 'Space Mono', monospace;
    --font-display: 'DM Serif Display', serif;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }

  body {
    font-family: var(--font-body);
    background-color: var(--bg);
    color: var(--black);
    min-height: 100vh;
    overflow-x: hidden;
    background-image: radial-gradient(circle, rgba(0,0,0,0.06) 1px, transparent 1px);
    background-size: 24px 24px;
  }

  /* LOADING */
  #loadingScreen {
    position: fixed; inset: 0; z-index: 9999;
    background: var(--pink);
    display: flex; align-items: center; justify-content: center;
    flex-direction: column; gap: 1.5rem;
    transition: opacity 0.4s ease;
  }
  #loadingScreen.hide { opacity: 0; pointer-events: none; }
  .load-logo { font-family: var(--font-display); font-size: 2.8rem; font-weight: 400; color: var(--black); font-style: italic; border: 3px solid var(--black); padding: 0.25rem 1.5rem; background: var(--white); box-shadow: var(--shadow-lg); }
  .load-bar { width: 220px; height: 4px; background: var(--black); border: 2px solid var(--black); overflow: hidden; }
  .load-fill { height: 100%; background: var(--lime); width: 0%; animation: loadIn 1.2s ease forwards; }
  @keyframes loadIn { to { width: 100%; } }

  /* TOP NAV */
  .topnav { position: sticky; top: 0; z-index: 100; background: var(--pink); border-bottom: var(--border); display: flex; align-items: center; justify-content: space-between; padding: 0 2rem; height: 60px; }
  .nav-logo { font-family: var(--font-display); font-size: 1.5rem; font-style: italic; color: var(--black); text-decoration: none; display: flex; align-items: center; gap: 10px; font-weight: 400; }
  .nav-dot { width: 10px; height: 10px; background: var(--lime); border: 2px solid var(--black); border-radius: 50%; animation: pulse-dot 2s infinite; flex-shrink: 0; box-shadow: 2px 2px 0 var(--black); }
  @keyframes pulse-dot { 0%,100%{transform:scale(1);} 50%{transform:scale(0.7);} }
  .nav-center { display: flex; align-items: center; gap: 0.25rem; }
  .nav-tab { font-family: var(--font-body); font-size: 0.8rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: var(--black); padding: 6px 14px; cursor: pointer; border: 2px solid transparent; transition: all 0.15s; background: none; text-decoration: none; border-radius: var(--radius); }
  .nav-tab:hover { background: rgba(0,0,0,0.08); }
  .nav-tab.active { background: var(--black); color: var(--pink); border-color: var(--black); }
  .nav-right { display: flex; align-items: center; gap: 0.75rem; }
  .nav-member-badge { display: flex; align-items: center; gap: 6px; background: var(--yellow); border: 2px solid var(--black); padding: 4px 12px; font-size: 0.72rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; box-shadow: var(--shadow-sm); color: var(--black); }
  .nav-avatar { width: 36px; height: 36px; background: var(--lime); border: 2px solid var(--black); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 0.85rem; color: var(--black); cursor: pointer; overflow: hidden; box-shadow: var(--shadow-sm); }
  .nav-avatar img { width: 100%; height: 100%; object-fit: cover; }
  .btn-logout { background: var(--white); border: 2px solid var(--black); color: var(--black); font-family: var(--font-body); font-size: 0.72rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; padding: 5px 14px; cursor: pointer; transition: all 0.15s; border-radius: var(--radius); box-shadow: var(--shadow-sm); }
  .btn-logout:hover { background: var(--black); color: var(--white); box-shadow: none; transform: translate(3px,3px); }

  /* ═══════════════════════════════════════════════
     LIVE TICKER — Now powered by your Google Sheet (Symbol, Price)
  ═══════════════════════════════════════════════ */
  .ticker-wrap {
    background: var(--black);
    border-bottom: var(--border);
    overflow: hidden; white-space: nowrap;
    padding: 7px 0;
    position: relative;
  }

  .ticker-status {
    position: absolute; right: 0; top: 0; bottom: 0;
    display: flex; align-items: center;
    background: var(--black);
    padding: 0 10px;
    z-index: 2;
    border-left: 1px solid #333;
  }
  .ticker-status-dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--lime); margin-right: 5px;
    animation: pulse-dot 2s infinite;
  }
  .ticker-status-dot.loading { background: var(--yellow); }
  .ticker-status-dot.error   { background: var(--pink); animation: none; }
  .ticker-status-text {
    font-family: var(--font-mono); font-size: 0.55rem;
    color: #666; text-transform: uppercase; letter-spacing: 0.1em;
  }
  .ticker-wrap::before,
  .ticker-wrap::after {
    content: ''; position: absolute; top: 0; bottom: 0; width: 60px; z-index: 1; pointer-events: none;
  }
  .ticker-wrap::before { left: 0;  background: linear-gradient(to right, var(--black), transparent); }
  .ticker-wrap::after  { right: 60px; background: linear-gradient(to left,  var(--black), transparent); }

  .ticker-inner {
    display: inline-flex; gap: 3rem;
    animation: ticker var(--ticker-duration, 40s) linear infinite;
    will-change: transform;
  }
  .ticker-inner.paused { animation-play-state: paused; }
  .ticker-item {
    font-family: var(--font-mono); font-size: 0.68rem; font-weight: 400;
    color: var(--yellow); text-transform: uppercase; letter-spacing: 0.06em;
    display: inline-flex; align-items: center; gap: 8px;
  }
  .ticker-price {
    color: #ddd;
    font-weight: 500;
    background: rgba(255,255,255,0.08);
    padding: 2px 6px;
    border-radius: 4px;
    font-size: 0.7rem;
  }
  .ticker-sep { color: #333; user-select: none; margin: 0 4px; }
  @keyframes ticker { 0%{transform:translateX(0);} 100%{transform:translateX(-50%);} }

  /* LAYOUT */
  .dash-wrap { display: grid; grid-template-columns: 260px 1fr; min-height: calc(100vh - 60px - 34px); }

  /* SIDEBAR */
  .sidebar { border-right: var(--border); padding: 1.5rem 0; position: sticky; top: 94px; height: calc(100vh - 94px); overflow-y: auto; background: var(--bg); }
  .sidebar-section { padding: 0 1.25rem; margin-bottom: 1.75rem; }
  .sidebar-label { font-family: var(--font-mono); font-size: 0.6rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.18em; color: #888; margin-bottom: 0.6rem; padding-bottom: 0.5rem; border-bottom: 1px solid rgba(0,0,0,0.12); }
  .sidebar-link { display: flex; align-items: center; gap: 10px; padding: 7px 10px; margin-bottom: 3px; font-size: 0.82rem; font-weight: 500; color: #555; cursor: pointer; transition: all 0.1s; border: 2px solid transparent; text-decoration: none; border-radius: var(--radius); }
  .sidebar-link:hover { color: var(--black); background: rgba(0,0,0,0.05); border-color: var(--black); }
  .sidebar-link.active { color: var(--black); background: var(--pink); border-color: var(--black); box-shadow: var(--shadow-sm); font-weight: 700; }
  .sl-icon { font-size: 0.9rem; flex-shrink: 0; }
  .sl-badge { margin-left: auto; background: var(--pink); color: var(--black); border: 1.5px solid var(--black); font-size: 0.58rem; font-weight: 700; padding: 1px 6px; border-radius: 3px; font-family: var(--font-mono); }
  .sl-badge.new { background: var(--lime); color: var(--black); }
  .sidebar-member-card { margin: 0 1.25rem 1.5rem; background: var(--yellow); border: var(--border); padding: 1.1rem; border-radius: var(--radius); box-shadow: var(--shadow); }
  .smc-avatar { width: 40px; height: 40px; background: var(--pink); border: 2px solid var(--black); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 1rem; color: var(--black); margin-bottom: 0.65rem; overflow: hidden; box-shadow: var(--shadow-sm); }
  .smc-avatar img { width: 100%; height: 100%; object-fit: cover; }
  .smc-name { font-weight: 700; font-size: 0.88rem; color: var(--black); margin-bottom: 1px; }
  .smc-email { font-size: 0.72rem; color: #555; margin-bottom: 0.65rem; }
  .smc-since { font-family: var(--font-mono); font-size: 0.6rem; color: var(--black); text-transform: uppercase; letter-spacing: 0.06em; display: flex; align-items: center; gap: 6px; }
  .smc-dot { width: 7px; height: 7px; background: var(--lime); border: 1.5px solid var(--black); border-radius: 50%; }

  /* CONTENT */
  .content { padding: 2.5rem 2rem; max-width: 960px; }

  /* SECTION */
  .dash-section { margin-bottom: 3rem; animation: fadeUp 0.4s ease forwards; }
  .dash-section-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1rem; padding-bottom: 0.75rem; border-bottom: var(--border); }
  .dash-section-title { font-family: var(--font-mono); font-size: 0.72rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.14em; color: var(--black); display: flex; align-items: center; gap: 8px; }
  .dash-section-title::before { content: '▪'; font-size: 0.8rem; color: var(--pink-dark); }
  .dash-section-link { font-family: var(--font-mono); font-size: 0.68rem; font-weight: 700; color: var(--black); text-decoration: none; text-transform: uppercase; letter-spacing: 0.08em; border-bottom: 2px solid var(--black); transition: color 0.15s; }
  .dash-section-link:hover { color: var(--pink-dark); border-color: var(--pink-dark); }

  /* WELCOME BANNER */
  .welcome-banner { background: var(--lime); border: var(--border); padding: 2rem 2.5rem; margin-bottom: 2.5rem; display: flex; align-items: center; justify-content: space-between; gap: 2rem; flex-wrap: wrap; position: relative; overflow: hidden; animation: fadeUp 0.4s ease forwards; border-radius: var(--radius); box-shadow: var(--shadow-lg); }
  .wb-deco { position: absolute; right: 1.5rem; top: 50%; transform: translateY(-50%); font-family: var(--font-display); font-size: 9rem; font-weight: 400; font-style: italic; color: rgba(0,0,0,0.07); line-height: 1; pointer-events: none; user-select: none; }
  .wb-tag { background: var(--black); color: var(--lime); font-family: var(--font-mono); font-size: 0.62rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; padding: 3px 10px; display: inline-block; margin-bottom: 0.75rem; border-radius: 3px; }
  .wb-title { font-family: var(--font-display); font-size: clamp(1.6rem, 3vw, 2.4rem); font-weight: 400; font-style: normal; line-height: 1.1; margin-bottom: 0.5rem; color: var(--black); }
  .wb-title em { font-style: italic; }
  .wb-sub { font-size: 0.85rem; color: #333; line-height: 1.6; font-weight: 400; }
  .wb-stats { display: flex; gap: 1.5rem; flex-shrink: 0; }
  .wb-stat { background: var(--white); border: var(--border); padding: 0.85rem 1.25rem; border-radius: var(--radius); box-shadow: var(--shadow-sm); text-align: center; }
  .wb-stat .num { font-family: var(--font-display); font-size: 2rem; font-weight: 400; font-style: italic; line-height: 1; color: var(--black); }
  .wb-stat .lbl { font-family: var(--font-mono); font-size: 0.58rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; color: #666; margin-top: 3px; }

  /* ISSUE CARD */
  .issue-card { background: var(--white); border: var(--border); overflow: hidden; margin-bottom: 1rem; border-radius: var(--radius); box-shadow: var(--shadow); transition: box-shadow 0.15s, transform 0.15s; }
  .issue-card:hover { box-shadow: var(--shadow-lg); transform: translate(-2px,-2px); }
  .issue-card-header { background: var(--black); border-bottom: var(--border); padding: 0.8rem 1.5rem; display: flex; justify-content: space-between; align-items: center; }
  .ich-title { font-family: var(--font-mono); font-weight: 700; font-size: 0.82rem; letter-spacing: 0.12em; color: var(--pink); }
  .ich-date { font-family: var(--font-mono); font-size: 0.62rem; color: rgba(255,255,255,0.5); }
  .issue-card-body { padding: 1.5rem; display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; }
  .icb-label { font-family: var(--font-mono); font-size: 0.6rem; font-weight: 700; color: var(--pink-dark); text-transform: uppercase; letter-spacing: 0.15em; margin-bottom: 0.55rem; }
  .icb-line { font-size: 0.8rem; color: #555; line-height: 1.6; border-bottom: 1px solid rgba(0,0,0,0.08); padding-bottom: 0.3rem; margin-bottom: 0.3rem; }
  .icb-line:last-child { border-bottom: none; }
  .icb-line strong { color: var(--black); font-weight: 700; }
  .issue-card-footer { padding: 1rem 1.5rem; border-top: var(--border); display: flex; gap: 0.75rem; align-items: center; background: #fafafa; }
  .btn-read { background: var(--pink); color: var(--black); border: 2px solid var(--black); padding: 8px 22px; font-family: var(--font-body); font-size: 0.78rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; cursor: pointer; transition: all 0.15s; text-decoration: none; border-radius: var(--radius); box-shadow: var(--shadow-sm); }
  .btn-read:hover { background: var(--black); color: var(--pink); box-shadow: none; transform: translate(3px,3px); }
  .btn-archive { background: transparent; color: var(--black); border: 2px solid var(--black); padding: 8px 20px; font-family: var(--font-body); font-size: 0.78rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; cursor: pointer; transition: all 0.15s; text-decoration: none; border-radius: var(--radius); box-shadow: var(--shadow-sm); }
  .btn-archive:hover { background: var(--black); color: var(--white); box-shadow: none; transform: translate(3px,3px); }

  /* SIGNAL GRID */
  .signal-grid { display: grid; grid-template-columns: repeat(3, 1fr); border: var(--border); border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow); }
  .signal-cell { padding: 1.25rem; border-right: 2px solid var(--black); border-bottom: 2px solid var(--black); transition: background 0.15s; background: var(--white); }
  .signal-cell:nth-child(3n) { border-right: none; }
  .signal-cell:nth-last-child(-n+3) { border-bottom: none; }
  .signal-cell:hover { background: var(--bg2); }
  .sc-coin { display: flex; align-items: center; justify-content: space-between; margin-bottom: 0.6rem; }
  .sc-name { font-weight: 700; font-size: 0.85rem; color: var(--black); }
  .sc-badge { padding: 2px 8px; font-family: var(--font-mono); font-size: 0.56rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; border-radius: 3px; border: 1.5px solid var(--black); }
  .badge-buy { background: var(--lime); color: var(--black); }
  .badge-watch { background: var(--yellow); color: var(--black); }
  .badge-reduce { background: var(--pink); color: var(--black); }
  .sc-pct { font-family: var(--font-display); font-size: 1.8rem; font-weight: 400; font-style: italic; line-height: 1; margin-bottom: 0.35rem; }
  .sc-pct.up { color: var(--lime-dark); }
  .sc-pct.dn { color: var(--pink-dark); }
  .sc-meta { font-size: 0.7rem; color: #666; line-height: 1.4; }
  .sc-conf { margin-top: 0.5rem; display: flex; align-items: center; gap: 6px; }
  .conf-bar { flex: 1; height: 4px; background: rgba(0,0,0,0.1); border: 1px solid var(--black); border-radius: 2px; }
  .conf-fill { height: 100%; background: var(--lime-dark); border-radius: 1px; }
  .conf-fill.red { background: var(--pink-dark); }
  .conf-label { font-family: var(--font-mono); font-size: 0.58rem; color: #777; white-space: nowrap; }

  /* WHALE ROWS */
  .whale-row { display: flex; align-items: center; gap: 1rem; padding: 1rem 1.25rem; background: var(--white); border: var(--border); margin-bottom: 0.5rem; transition: all 0.15s; border-radius: var(--radius); box-shadow: var(--shadow-sm); }
  .whale-row:hover { background: var(--bg2); box-shadow: none; transform: translate(3px,3px); }
  .whale-icon { width: 38px; height: 38px; background: var(--yellow); border: 2px solid var(--black); border-radius: var(--radius); display: flex; align-items: center; justify-content: center; font-size: 1rem; flex-shrink: 0; box-shadow: var(--shadow-sm); }
  .whale-main { flex: 1; }
  .whale-addr { font-family: var(--font-mono); font-size: 0.68rem; color: #777; margin-bottom: 2px; }
  .whale-action { font-size: 0.8rem; color: #555; }
  .whale-action strong { color: var(--black); font-weight: 700; }
  .whale-amount { font-family: var(--font-display); font-size: 1.1rem; font-weight: 400; font-style: italic; text-align: right; flex-shrink: 0; }
  .whale-amount.sell { color: var(--pink-dark); }
  .whale-amount.buy { color: var(--lime-dark); }
  .whale-time { font-family: var(--font-mono); font-size: 0.58rem; color: #aaa; margin-top: 1px; text-align: right; }

  /* METRICS GRID */
  .metrics-grid { display: grid; grid-template-columns: repeat(4, 1fr); border: var(--border); border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow); }
  .metric-cell { padding: 1.5rem; border-right: 2px solid var(--black); text-align: center; background: var(--white); position: relative; }
  .metric-cell:nth-child(1) { background: var(--lime); }
  .metric-cell:nth-child(2) { background: var(--yellow); }
  .metric-cell:nth-child(3) { background: var(--pink); }
  .metric-cell:nth-child(4) { background: var(--white); }
  .metric-cell:last-child { border-right: none; }
  .mc-val { font-family: var(--font-display); font-size: 2.2rem; font-weight: 400; font-style: italic; line-height: 1; margin-bottom: 0.4rem; color: var(--black); }
  .mc-label { font-family: var(--font-mono); font-size: 0.6rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; color: var(--black); }

  /* ARCHIVE ROWS */
  .archive-row { display: flex; align-items: center; gap: 1rem; padding: 0.85rem 1.25rem; border: var(--border); margin-bottom: 0.5rem; transition: all 0.15s; cursor: pointer; text-decoration: none; color: inherit; border-radius: var(--radius); background: var(--white); box-shadow: var(--shadow-sm); }
  .archive-row:hover { background: var(--bg2); box-shadow: none; transform: translate(3px,3px); }
  .ar-num { font-family: var(--font-mono); font-size: 0.75rem; font-weight: 700; color: #aaa; flex-shrink: 0; width: 56px; }
  .ar-title { font-size: 0.82rem; font-weight: 500; color: var(--black); flex: 1; }
  .ar-date { font-family: var(--font-mono); font-size: 0.65rem; color: #888; flex-shrink: 0; }
  .ar-tag { padding: 2px 8px; font-family: var(--font-mono); font-size: 0.56rem; font-weight: 700; text-transform: uppercase; background: var(--yellow); color: var(--black); border: 1.5px solid var(--black); flex-shrink: 0; border-radius: 3px; }

  /* DEFI CARDS */
  .defi-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0; border: var(--border); border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow); }
  .defi-card { padding: 1.5rem; border-right: 2px solid var(--black); border-bottom: 2px solid var(--black); background: var(--white); transition: background 0.15s; }
  .defi-card:hover { background: var(--bg2); }
  .defi-card:nth-child(2n) { border-right: none; }
  .defi-card:nth-last-child(-n+2) { border-bottom: none; }
  .dc-protocol { font-family: var(--font-mono); font-size: 0.62rem; font-weight: 700; color: #888; text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 0.4rem; }
  .dc-title { font-weight: 700; font-size: 0.95rem; color: var(--black); margin-bottom: 0.5rem; line-height: 1.3; }
  .dc-apy { font-family: var(--font-display); font-size: 2.4rem; font-weight: 400; font-style: italic; line-height: 1; margin-bottom: 0.4rem; color: var(--lime-dark); }
  .dc-desc { font-size: 0.78rem; color: #555; line-height: 1.6; }
  .dc-tag { display: inline-block; margin-top: 0.75rem; background: var(--lime); color: var(--black); border: 1.5px solid var(--black); font-family: var(--font-mono); font-size: 0.58rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; padding: 2px 8px; border-radius: 3px; }

  /* REWARDS */
  @keyframes rewardFloat { 0%,100%{ transform: translateY(0); } 50%{ transform: translateY(-3px); } }
  .rewards-unclaimed-badge { background: var(--yellow); color: var(--black); border: 2px solid var(--black); font-family: var(--font-mono); font-size: 0.62rem; padding: 3px 10px; border-radius: 3px; font-weight: 700; box-shadow: var(--shadow-sm); }
  .bybit-check-btn { display: flex; align-items: center; gap: 6px; background: var(--black); border: 2px solid var(--black); color: var(--yellow); font-family: var(--font-mono); font-size: 0.7rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; padding: 5px 14px; cursor: pointer; border-radius: var(--radius); transition: all 0.15s; box-shadow: var(--shadow-sm); }
  .bybit-check-btn:hover { background: #333; box-shadow: none; transform: translate(3px,3px); }
  .bybit-icon { font-size: 0.8rem; }
  .bybit-banner { background: var(--yellow); border: var(--border); border-radius: var(--radius); padding: 1rem 1.5rem; display: flex; align-items: center; gap: 1rem; margin-bottom: 1.5rem; flex-wrap: wrap; box-shadow: var(--shadow); }

  /**
   * Parse CSV row handling quoted fields.
   */
  function parseCSVRow(row) {
    const result = [];
    let field = '';
    let inQuotes = false;
    for (let i = 0; i < row.length; i++) {
      const ch = row[i];
      if (ch === '"') inQuotes = !inQuotes;
      else if (ch === ',' && !inQuotes) {
        result.push(field.trim());
        field = '';
      } else field += ch;
    }
    result.push(field.trim());
    return result;
  }

  /**
   * Fetch symbol and price from Google Sheet (columns: Symbol, Price)
   * Returns array of { symbol, price: number }
   */
  async function fetchTickerData() {
    const url = `https://docs.google.com/spreadsheets/d/${TICKER_SHEET_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(TICKER_SHEET_TAB)}`;
    const resp = await fetch(url);
    if (!resp.ok) throw new Error(`Sheet fetch failed: ${resp.status}`);
    const csv = await resp.text();
    const rows = csv.split('\n').filter(r => r.trim().length > 0);
    if (rows.length < 2) throw new Error('Sheet has no data rows');
    
    // Parse header to find Symbol and Price columns
    const headerCells = parseCSVRow(rows[0]);
    const symbolIdx = headerCells.findIndex(cell => cell.toLowerCase() === 'symbol');
    const priceIdx  = headerCells.findIndex(cell => cell.toLowerCase() === 'price');
    if (symbolIdx === -1 || priceIdx === -1) {
      throw new Error('Sheet must contain columns "Symbol" and "Price" (case-insensitive)');
    }

    const tickerItems = [];
    for (let i = 1; i < rows.length; i++) {
      const cells = parseCSVRow(rows[i]);
      if (cells.length <= Math.max(symbolIdx, priceIdx)) continue;
      let symbol = cells[symbolIdx].trim().toUpperCase();
      let priceRaw = cells[priceIdx].trim();
      if (!symbol || !priceRaw) continue;
      // Parse price: remove $, commas, convert to number
      let priceNum = parseFloat(priceRaw.replace(/[^0-9.-]/g, ''));
      if (isNaN(priceNum)) continue;
      tickerItems.push({ symbol, price: priceNum });
    }
    if (tickerItems.length === 0) throw new Error('No valid symbol/price pairs found in sheet');
    return tickerItems;
  }

  /**
   * Format price for display (compact, with $)
   */
  function formatPrice(price) {
    if (price === null || price === undefined) return '—';
    if (price >= 1000)    return '$' + price.toLocaleString('en-US', { maximumFractionDigits: 0 });
    if (price >= 1)       return '$' + price.toFixed(2);
    if (price >= 0.01)    return '$' + price.toFixed(4);
    return '$' + price.toFixed(6);
  }

  /**
   * Render ticker with items from sheet (no change %, just price)
   */
  function renderTicker(items) {
    const inner = document.getElementById('tickerInner');
    if (!items.length) {
      inner.innerHTML = '<span class="ticker-item">⚠️ No ticker data available</span>';
      return;
    }
    // Build one full pass
    const itemsHTML = items.map(item => {
      const priceStr = formatPrice(item.price);
      return `<span class="ticker-item">${item.symbol} <span class="ticker-price">${priceStr}</span></span>`;
    }).join('<span class="ticker-sep"> · </span>');
    
    // Duplicate for seamless loop
    inner.innerHTML = itemsHTML + '<span class="ticker-sep" style="padding-right:3rem;"> </span>' + itemsHTML;
    
    // Speed: ~80px per second, based on number of items
    const duration = Math.max(18, items.length * 2.2);
    inner.style.setProperty('--ticker-duration', duration + 's');
    document.querySelector('.ticker-wrap').style.setProperty('--ticker-duration', duration + 's');
    // restart animation
    inner.style.animation = 'none';
    void inner.offsetWidth;
    inner.style.animation = `ticker ${duration}s linear infinite`;
    
    // Update status
    const dot = document.getElementById('tickerDot');
    const statusSpan = document.getElementById('tickerStatusText');
    dot.className = 'ticker-status-dot';
    statusSpan.textContent = `Live · ${new Date().toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' })}`;
  }

  }

  let cachedTickerItems = null;
  async function refreshTicker() {
    const dot = document.getElementById('tickerDot');
    const statusSpan = document.getElementById('tickerStatusText');
    dot.className = 'ticker-status-dot loading';
    statusSpan.textContent = 'Updating…';
    try {
      const items = await fetchTickerData();
      cachedTickerItems = items;
      renderTicker(items);
    } catch (err) {
      console.warn('[Ticker] Error:', err.message);
      dot.className = 'ticker-status-dot error';
      statusSpan.textContent = 'Sheet error';
      if (!cachedTickerItems) renderFallbackTicker();
      else renderTicker(cachedTickerItems); // use last good data
    }
  }

  // Initial load + auto-refresh every 60 seconds
  refreshTicker();
  setInterval(refreshTicker, 60000);
